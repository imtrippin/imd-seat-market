name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Pairing helper self-test
        run: node contracts/script/pair-vault.mjs --selftest
      - name: Offline script tests
        env:
          REVIEW_PYTHON: python3
        run: node --test test/pair-vault.test.mjs test/codex/vault-round3.test.mjs

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Format check
        run: forge fmt --check src test script
      - name: Build
        run: forge build
      - name: Unit, fuzz and invariant tests
        run: forge test
