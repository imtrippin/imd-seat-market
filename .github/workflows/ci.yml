name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Pairing helper self-test
        run: node contracts/script/pair-vault.mjs --selftest
      - name: Offline script tests
        env:
          REVIEW_PYTHON: python3
        run: node --test test/pair-vault.test.mjs test/codex/vault-round3.test.mjs

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Format check
        run: forge fmt --check src test script
      - name: Build
        run: forge build
      - name: Unit and fuzz tests
        run: forge test

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Build the artifacts the end-to-end test deploys
        working-directory: contracts
        run: forge build
      - name: Install
        working-directory: host
        run: npm ci --no-audit --no-fund
      - name: ABI files match the artifacts
        working-directory: host
        run: npm run abi && git diff --exit-code -- abi
      - name: Unit and end-to-end tests (anvil + fake IMD)
        working-directory: host
        run: npm test

  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: page
        run: npm ci --no-audit --no-fund
      - name: The host library the page is built from (its tests import it)
        working-directory: host
        run: npm ci
      - name: Browser for the page tests
        working-directory: page
        run: npx playwright install --with-deps chromium
      - name: Guards and the bundle in a browser
        working-directory: page
        run: npm test
      - name: The committed bundle matches the sources and the config
        working-directory: page
        run: npm run check
